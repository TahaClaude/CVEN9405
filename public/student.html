<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mode Choice — Student</title>
<style>body{font:16px system-ui;max-width:700px;margin:auto;padding:20px;background:#f5f7fb;color:#172033}h1{margin-bottom:4px}.muted{color:#667085}.join,.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px #17203318;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #ccd3df}button{background:#1769e0;color:white;border:0;cursor:pointer}.alternatives{display:grid;gap:12px}.alt{border:2px solid #dbe1eb;border-radius:12px;padding:16px;background:white}.alt h2{margin:0 0 10px}.alt button{width:100%;margin-top:12px}.hidden{display:none}.tag{display:inline-block;background:#edf3ff;color:#1769e0;padding:5px 9px;border-radius:99px}</style>
<h1>Transport mode choice</h1><div class="muted">Join the live classroom experiment</div>
<section id="join" class="join"><label>Enter your anonymous student code</label><p><input id="id" placeholder="e.g. S01" maxlength="12"> <button onclick="join()">Join</button></p><div class="muted">Use the same code throughout the activity. Do not enter your name.</div></section>
<main id="main" class="hidden"><div id="status" class="tag"></div><div id="task" class="card"></div></main>
<script>
let sid='', state=null, answered=false; const $=x=>document.getElementById(x);
async function join(){sid=$('id').value.trim()||crypto.randomUUID().slice(0,6); await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:sid})}); $('join').classList.add('hidden');$('main').classList.remove('hidden'); refresh(); const es=new EventSource('/api/events'); es.onmessage=e=>{state=JSON.parse(e.data); render();};}
async function refresh(){state=await (await fetch('/api/state')).json();render();}
function render(){if(!state.task)return; $('status').textContent=answered?'Response recorded — waiting for next task':'Round '+state.round+' · Choose one option'; $('task').innerHTML='<h2>Which option would you prefer?</h2><p class="muted">Assume all three options are available for the same trip.</p><div class="alternatives">'+state.task.alternatives.map(a=>`<div class="alt"><h2>${a.mode}</h2><div>Travel time: <b>${a.time} minutes</b></div><div>Cost: <b>$${a.cost}</b></div><div>Reliability: <b>${a.reliability}</b></div><button ${answered?'disabled':''} onclick="choose('${a.mode}')">Choose ${a.mode}</button></div>`).join('')+'</div>';}
async function choose(choice){await fetch('/api/choice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:sid,taskId:state.task.id,choice})});answered=true;render();}
</script>
